name: PR Check

on:
  pull_request:
    branches: ['main', 'master']

jobs:
  validate-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.JS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependences
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint

      - name: Build NextJS App
        run: npm run build
